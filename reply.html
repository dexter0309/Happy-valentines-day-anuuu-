<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reply to Ur Lovely Batoot</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #e63946;
      color: white;
      text-align: center;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .container {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.7);
      border-radius: 10px;
    }
    h1 {
      font-size: 2.5em;
      margin-bottom: 30px;
    }
    textarea {
      width: 80%;
      height: 150px;
      padding: 10px;
      font-size: 1.2em;
      margin-top: 20px;
      border-radius: 5px;
      border: none;
      outline: none;
      resize: none;
    }
    button {
      padding: 15px 25px;
      font-size: 1.2em;
      background-color: #e63946;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover {
      background-color: #f1faee;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Reply to My Message 💖</h1>
    <textarea id="reply" placeholder="Write your reply here..."></textarea>
    <button onclick="submitReply()">Submit Reply</button>
  </div>

  <script>
    function submitReply() {
      const replyMessage = document.getElementById("reply").value;
      if (replyMessage !== "") {
        alert("Thank you for your the reply ya caramela! 💌");
        // You can save the reply to a database or use it in some other way here
      } else {
        alert("Please write a reply before submitting!");
      }
    }
  </script>
</body>
</html>
